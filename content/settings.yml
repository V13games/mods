# Settings for the whole site. Change the text after a colon, then commit. Lines starting with # are notes.

# The name at the top left and in the footer.
name: Project Neutral

# A line about the site. It shows when someone shares a link to it (on Discord, Google and so on).
description: Mods, plugins and games for FiveM, Minecraft and more, made by Project Neutral.

# Your Discord invite link, like https://discord.gg/abc123
# Make one that never expires: in Discord, Invite People > Edit invite link > Expire after: Never.
# With this filled in, the site gets Join Discord buttons and shows how many people are online.
discord:

# The line under the big NEUTRAL on the front page.
tagline: Mods and plugins for FiveM and Minecraft, and free games you play in your browser.

# The text in the Discord box.
join_text: Releases, updates and help are posted on the Discord first.

# Your games site. It gets its own Games tab, with every game read live from it.
games_site: https://v13games.github.io/

# The tabs, in this order (Home, Games, Posts and Discord are always there).
# A mod for a new game adds its own tab by itself. Other only shows when something is in it.
categories: FiveM, Minecraft, Other

# The line under each tab's big name. Add one for a new game the same way, like  roblox_text: ...
fivem_text: Scripts and resources for FiveM servers.
minecraft_text: Plugins and mods for Minecraft servers and worlds.
other_text: Everything else Project Neutral makes.
games_text: Free games you play in your browser. Nothing to install.

# Accounts (log in with GitHub or Google) and the Admin page, run by Supabase.
# Both come from Supabase: Project Settings > API (the Project URL, and the publishable or anon key).
# These are made to be public. Never put a secret key here.
# While these are empty, there is no Log in link.
supabase_url:
supabase_key:

# Where this site lives. Only change it if the site moves.
url: https://v13games.github.io/mods/
