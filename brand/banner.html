<!doctype html>
<!-- The Project Neutral banner, made at any size: the logo and the name in the middle of a plain dark background.
     ?s= sets how big the logo and name are (1 fits YouTube's safe area; 1.35 for Discord and link previews).
     Make the PNGs with brand/make-images.ps1. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Neutral banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Inter+Tight:wght@700&display=swap">
<script>document.documentElement.style.setProperty('--s', new URLSearchParams(location.search).get('s') || '1');</script>
<style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#111816}
.b{width:100vw;height:100vh;display:grid;place-items:center}
.lock{display:flex;align-items:center;gap:calc(var(--s) * 2.4vw)}
.lock svg{flex:none;width:calc(var(--s) * 12vw);height:calc(var(--s) * 12vw);color:#bfffa8}
.name{margin:0;color:#bfffa8;font:700 calc(var(--s) * 4.8vw)/1.02 'Inter Tight',Helvetica,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase}
.name span{display:block}
.what{margin:calc(var(--s) * 1.2vw) 0 0;color:#6f9565;font:400 calc(var(--s) * 1.3vw)/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
<div class="b">
  <div class="lock">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="118.2 20" transform="rotate(-19 32 32)"/>
      <rect x="44.56" y="13.44" width="6" height="6" rx="1.5" fill="currentColor"/>
      <path d="M23 43V21l18 22V21" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <p class="name"><span>Project</span><span>Neutral</span></p>
      <p class="what">Mods / Plugins / Games</p>
    </div>
  </div>
</div>
</body>
</html>
