<!doctype html>
<!-- The Project Neutral icon, made at any square size (512 for Discord, 800 for YouTube).
     Discord and YouTube show it as a circle, so everything stays in the middle. Make the PNGs with brand/make-images.ps1. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Neutral icon</title>
<style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#111816}
.i{width:100vw;height:100vh;display:grid;place-items:center}
svg{width:76vmin;height:76vmin;color:#bfffa8}
</style>
</head>
<body>
<div class="i">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="118.2 20" transform="rotate(-19 32 32)"/>
    <rect x="44.36" y="13.24" width="6.4" height="6.4" rx="1.6" fill="currentColor"/>
    <path d="M23 43V21l18 22V21" fill="none" stroke="currentColor" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>
</body>
</html>
